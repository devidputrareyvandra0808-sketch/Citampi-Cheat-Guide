const TABS=["Karakter","Toko","Crafting","Masakan","Mancing","Info"];

let tab="Karakter",sub=0;

 (D.src[k]||[]).forEach(s=>h+="<p>📍 "+e(s)+"</p>");
 (R[k]||[]).forEach(r=>h+="<p>"+(r.category==="Masakan"?"🍳 Masak":"🔨 Crafting di "+e(r.category))+":</p>"+(r.v||[r.ingredients]).map(v=>"<div class='chips'>"+v.map(chip).join("")+"</div>").join("<p>atau</p>"));
 if(!h)h="<p>Belum ada data cara mendapatkan item ini (cek sumber lain / langsung di game).</p>";
 $("sheet").innerHTML='<button class="close" id="cl">Tutup</button><h2>'+e(n)+"</h2>"+h;$("m").classList.add("show")}

document.addEventListener("click",ev=>{const b=ev.target.closest(".chip");if(b)how(b.dataset.i)});
function bar(){$("tabs").innerHTML=TABS.map(t=>'<button data-t="'+t+'" class="'+(t===tab?"on":"")+'">'+t+"</button>").join("");

function items(){const out=[];
 if(tab==="Karakter")D.chars.filter(c=>sub===0||c.li).forEach(c=>out.push({x:c.n,h:card(c.n,[c.t?"🎟️ "+c.t:"",c.w?"📍 "+c.w:"",c.note||""].filter(Boolean).join(" | "),'<div class="label">⭐ Special</div><div class="chips">'+c.s.map(chip).join("")+'</div><div class="label">❤️ Favorit</div><div class="chips">'+c.f.map(chip).join("")+"</div>")}));

 if(tab==="Mancing"){const w=SUBS.Mancing[sub];

 return out}
